<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3EBDD"/>
      <stop offset="1" stop-color="#E3D3BC"/>
    </linearGradient>
    <linearGradient id="irid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FA98A"/>
      <stop offset="0.55" stop-color="#4E9E9B"/>
      <stop offset="1" stop-color="#7B63B5"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect x="56" y="56" width="912" height="912" rx="205" fill="url(#bg)"/>

  <!-- 地面投影 -->
